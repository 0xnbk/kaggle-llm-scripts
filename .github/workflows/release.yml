name: Validate and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Validate scripts
        run: |
          for script in scripts/kaggle/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Package scripts and checksums
        run: |
          mkdir -p dist
          cp scripts/kaggle/*.sh dist/
          (cd dist && sha256sum *.sh > SHA256SUMS)

      - name: Create draft release and attach scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.sh dist/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
